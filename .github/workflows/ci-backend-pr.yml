name: CI Backend PR

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-backend-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openspeak
          POSTGRES_PASSWORD: openspeak
          POSTGRES_DB: openspeak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openspeak -d openspeak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://openspeak:openspeak@localhost:5432/openspeak_test
      PORT: "3001"
      NODE_ENV: test
      ALLOW_DESTRUCTIVE_DB_TESTS: "true"
      CORS_ORIGIN: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Build production backend
        run: npm run build

      - name: Rehearse production migrations on ephemeral CI database
        run: npm run migration:run:prod

      - name: Rehearse learning content seed twice
        run: |
          npm run seed:learning:prod
          npm run seed:learning:prod

      - name: Verify learning content integration
        run: npm run test:e2e -- --runInBand learning-content-seed.e2e-spec.ts

      - name: E2E tests
        run: npm run test:e2e -- --ci
