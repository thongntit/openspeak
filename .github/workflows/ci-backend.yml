name: CI Backend

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openspeak
          POSTGRES_PASSWORD: openspeak
          POSTGRES_DB: openspeak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openspeak -d openspeak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://openspeak:openspeak@localhost:5432/openspeak_test
      PORT: "3001"
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Run migrations on ephemeral CI database
        run: npm run migration:run

      - name: E2E tests
        run: npm run test:e2e -- --ci

  publish-backend-image:
    name: Publish backend image to ghcr.io
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/dev' ||
       startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openspeak-backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy dev backend
    runs-on: ubuntu-latest
    needs: [publish-backend-image]
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Trigger dev Coolify redeploy
        run: |
          curl --fail-with-body --silent --show-error \
            -X GET "${{ secrets.COOLIFY_DEV_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

  deploy-production:
    name: Deploy production backend
    runs-on: ubuntu-latest
    needs: [publish-backend-image]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger production Coolify redeploy
        run: |
          curl --fail-with-body --silent --show-error \
            -X GET "${{ secrets.COOLIFY_PROD_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
