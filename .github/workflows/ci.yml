name: CI

on:
  push:
    branches: [main, master, "claude/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openspeak
          POSTGRES_PASSWORD: openspeak
          POSTGRES_DB: openspeak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openspeak -d openspeak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://openspeak:openspeak@localhost:5432/openspeak_test
      PORT: "3001"
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migration:run

      - name: E2E tests
        run: npm run test:e2e -- --ci

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
