# fly.toml — run `fly launch --no-deploy` once to pick an app name / region,
# then `fly deploy`. Provision Postgres with:
#   fly postgres create --name openspeak-db
#   fly postgres attach openspeak-db
# Set CORS origin:
#   fly secrets set CORS_ORIGIN=https://your-frontend.example.com

app = "openspeak-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
