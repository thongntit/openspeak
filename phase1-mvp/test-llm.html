<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Local LLM</title>
    <style>
        body {
            font-family: system-ui;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
        #status {
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            margin: 20px 0;
            min-height: 50px;
        }
        .loading {
            color: #ff9800;
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #f44336;
        }
        #output {
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Test Local LLM in Browser</h1>

    <div>
        <button id="testSmolLM2">Test SmolLM2-135M (Recommended)</button>
        <button id="testDistilGPT2">Test DistilGPT2 (Backup)</button>
        <button id="testWebLLM">Test WebLLM SmolLM2</button>
    </div>

    <div id="status">Click a button to test a model...</div>
    <div id="output" style="display: none;"></div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        const statusDiv = document.getElementById('status');
        const outputDiv = document.getElementById('output');

        function setStatus(message, className = '') {
            statusDiv.textContent = message;
            statusDiv.className = className;
        }

        function showOutput(text) {
            outputDiv.style.display = 'block';
            outputDiv.textContent = text;
        }

        // Test 1: SmolLM2-135M-Instruct (Most Popular)
        document.getElementById('testSmolLM2').addEventListener('click', async () => {
            try {
                setStatus('Loading SmolLM2-135M-Instruct... (~270 MB)', 'loading');

                const generator = await pipeline(
                    'text-generation',
                    'HuggingFaceTB/SmolLM2-135M-Instruct'
                );

                setStatus('Model loaded! Generating response...', 'success');

                const messages = [
                    { role: "system", content: "You are a helpful English teacher." },
                    { role: "user", content: "What is the capital of France?" }
                ];

                const output = await generator(messages, {
                    max_new_tokens: 50,
                    temperature: 0.7
                });

                const response = output[0].generated_text.at(-1).content;
                setStatus('✅ SmolLM2 Success!', 'success');
                showOutput(`Model: SmolLM2-135M-Instruct\nPrompt: "What is the capital of France?"\n\nResponse: ${response}`);

            } catch (error) {
                setStatus('❌ Error: ' + error.message, 'error');
                console.error('SmolLM2 error:', error);
            }
        });

        // Test 2: DistilGPT2 (Proven Backup)
        document.getElementById('testDistilGPT2').addEventListener('click', async () => {
            try {
                setStatus('Loading DistilGPT2... (~80 MB)', 'loading');

                const generator = await pipeline(
                    'text-generation',
                    'Xenova/distilgpt2'
                );

                setStatus('Model loaded! Generating response...', 'success');

                const output = await generator('The capital of France is', {
                    max_new_tokens: 20,
                    temperature: 0.7,
                    do_sample: true
                });

                setStatus('✅ DistilGPT2 Success!', 'success');
                showOutput(`Model: DistilGPT2\nPrompt: "The capital of France is"\n\nResponse: ${output[0].generated_text}`);

            } catch (error) {
                setStatus('❌ Error: ' + error.message, 'error');
                console.error('DistilGPT2 error:', error);
            }
        });

        // Test 3: WebLLM SmolLM2
        document.getElementById('testWebLLM').addEventListener('click', async () => {
            try {
                setStatus('Loading WebLLM library...', 'loading');

                // Dynamically import WebLLM
                const webllm = await import('https://esm.run/@mlc-ai/web-llm');

                setStatus('Loading SmolLM2 via WebLLM... (~719 MB)', 'loading');

                const engine = await webllm.CreateMLCEngine(
                    "SmolLM2-135M-Instruct-q0f32-MLC",
                    {
                        initProgressCallback: (progress) => {
                            if (progress.progress) {
                                const percent = Math.round(progress.progress * 100);
                                setStatus(`Loading model... ${percent}%`, 'loading');
                            }
                        }
                    }
                );

                setStatus('Model loaded! Generating response...', 'success');

                const messages = [
                    { role: "system", content: "You are a helpful English teacher." },
                    { role: "user", content: "What is the capital of France?" }
                ];

                const reply = await engine.chat.completions.create({
                    messages: messages,
                    temperature: 0.7,
                    max_tokens: 50
                });

                const response = reply.choices[0].message.content;
                setStatus('✅ WebLLM Success!', 'success');
                showOutput(`Model: SmolLM2-135M via WebLLM\nPrompt: "What is the capital of France?"\n\nResponse: ${response}`);

            } catch (error) {
                setStatus('❌ Error: ' + error.message, 'error');
                console.error('WebLLM error:', error);
            }
        });
    </script>
</body>
</html>
