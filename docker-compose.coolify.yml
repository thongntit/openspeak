services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openspeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-openspeak}
    volumes:
      - openspeak_pg:/var/lib/postgresql/data

  api:
    image: ghcr.io/thongntit/openspeak-backend:${BACKEND_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openspeak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openspeak}
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      WORDS_JSON_PATH: /app/database/words.json
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  openspeak_pg:
