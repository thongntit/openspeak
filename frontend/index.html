<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/assets/icons/icon-120.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gramio" />
    <title>Gramio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/assets/icons/icon-512.png" fetchpriority="high" />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>
    
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Lexend', sans-serif;
      }
      
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        z-index: 9999;
      }
      
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      
      .logo-container {
        position: relative;
        width: 128px;
        height: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .logo-glow {
        position: absolute;
        inset: 0;
        background-color: rgba(19, 127, 236, 0.05);
        border-radius: 50%;
        transform: scale(1.25);
      }
      
      .logo-img {
        position: relative;
        z-index: 10;
        width: 96px;
        height: 96px;
        border-radius: 22%;
        box-shadow: 0 4px 14px rgba(19, 127, 236, 0.18), 0 1px 2px rgba(0, 0, 0, 0.05);
        display: block;
      }
      
      .app-title {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: #111418;
      }
      
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        margin-top: 2rem;
      }
      
      .loading-text {
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #111418;
        opacity: 0.6;
      }
      
      .loading-dots {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      
      .loading-dot {
        width: 10px;
        height: 10px;
        background-color: #137fec;
        border-radius: 50%;
        animation: bounce 1.4s ease-in-out infinite;
      }
      
      .loading-dot:nth-child(1) { animation-delay: 0s; }
      .loading-dot:nth-child(2) { animation-delay: 0.2s; }
      .loading-dot:nth-child(3) { animation-delay: 0.4s; }
      
      @keyframes bounce {
        0%, 80%, 100% {
          transform: scale(0);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
      
      .quote {
        text-align: center;
        font-size: 0.875rem;
        font-weight: 400;
        line-height: 1.5;
        color: #637588;
        opacity: 0.8;
        margin-top: 0.5rem;
      }
      
      @media (prefers-color-scheme: dark) {
        #splash-screen {
          background-color: #101922;
        }

        .app-title {
          color: #ffffff;
        }
        
        .loading-text {
          color: #ffffff;
          opacity: 0.6;
        }
        
        .quote {
          color: rgba(255, 255, 255, 0.4);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-content">
        <div class="logo-container">
          <div class="logo-glow"></div>
          <img class="logo-img" src="/assets/icons/icon-512.png" width="96" height="96" alt="Gramio" decoding="async" fetchpriority="high" />
        </div>
        
        <div class="app-title">Gramio</div>
        
        <div class="loading-container">
          <div class="loading-text">Loading</div>
          <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
          </div>
        </div>
        
        <div class="quote">Learn English, one card at a time</div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
